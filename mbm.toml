# micropython-branch-manager (mbm)
# Install: pip install micropython-branch-manager
#          or: uv tool install micropython-branch-manager
# Usage:   mbm --help

[[submodules]]
path = "src/micropython"
integration_branch = "tessera"

[[submodules.branches]]
name = "machine-usbhost"
pr_url = "https://github.com/andrewleech/micropython/tree/machine-usbhost"
title = "Add native USB host (machine.USBHost) across ports + shared TinyUSB host infra"

[[submodules.branches]]
name = "network-mdns"
pr_url = "https://github.com/andrewleech/micropython/tree/network-mdns"
title = "extmod/network: expose lwIP mDNS responder services (network.mdns_add_service)"

[[submodules.branches]]
name = "tinyusb-host-no-werror"
pr_url = ""
title = "rp2/tinyusb: do not -Werror unused-variable on vendored TinyUSB host sources"

[[submodules.branches]]
name = "tinyusb-rp2-host-abort"
pr_url = "https://github.com/andrewleech/micropython/tree/tinyusb-rp2-host-abort"
title = "lib/tinyusb: bump to rp2 host endpoint abort/close fix (hathach/tinyusb#3702)"

[[submodules.branches]]
name = "manifest_c_module"
pr_url = "https://github.com/micropython/micropython/pull/18229"
pr_number = 18229
title = "Add c_module() manifest function for user C modules"

[[submodules.branches]]
name = "native_async_repl"
pr_url = "https://github.com/andrewleech/micropython/tree/native_async_repl"
title = "extmod/asyncio: native async REPL (arepl) over stdio+dupterm, Ctrl-C + raw-paste, coexists with asyncio"
