name: licensing

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  reuse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: REUSE compliance
        run: pipx run reuse lint

  dco:
    # Every non-merge commit in a pull request must carry a Developer
    # Certificate of Origin sign-off (see CONTRIBUTING.md).
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check Signed-off-by trailers
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for c in $(git rev-list --no-merges "$BASE..$HEAD"); do
            if ! git log -1 --format=%B "$c" | grep -q -E '^Signed-off-by: .+ <.+@.+>$'; then
              echo "::error::$(git log -1 --format='%h %s' "$c") has no Signed-off-by trailer"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Sign off each commit with 'git commit -s'; see CONTRIBUTING.md."
            exit 1
          fi
