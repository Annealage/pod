[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "annealage-pod-host"
version = "0.1.0"
description = "Host-side tooling for the Annealage Pod hardware-in-the-loop test rig."
requires-python = ">=3.10"
# ampremote (Andrew's async mpremote fork - improved TCP + raw-REPL support over
# upstream) is the single mpremote this project uses. It installs as the
# `mpremote` import package AND provides the `ampremote` console script, so both
# consumers resolve to the same code: pod.client shells out to `ampremote` for
# the one-shot exec/eval/cp/mount verbs, and pod.session imports
# mpremote.transport_serial.SerialTransport for the persistent streaming REPL.
# Do not install upstream `mpremote` alongside it; both claim the `mpremote`
# import name, and whichever wins silently decides which transport code runs.
#
# Not on PyPI, so it installs from git. Pinned to a commit rather than @main so
# the transport contract is reproducible on another host; bump deliberately.
#
# The pin names the fork of micropython directly with the package's own
# subdirectory: one repo and one SHA, so a clean install needs no submodule init
# and does not depend on a wrapper repo's gitlink. The commit is tagged
# ampremote-pin-54a3b1ea5e82 so it cannot be garbage collected out from under
# this pin.
#
# That tag is only safe because the package restricts its version discovery to
# version tags (git describe --match "v[0-9]*"). The package versions itself
# from VCS, and a checkout sitting exactly on a NON-version tag - which is what
# a SHA pin always produces - previously made the build fail outright with
# "Can't parse version from tag". Verified at this commit: describe over all
# tags still yields the unparseable ampremote-pin-54a3b1ea5e82, while the
# restricted match yields v1.29.0-61-g54a3b1ea5e. So do not pin to a commit in
# a fork whose packaging predates that fix.
#
# Verified for this pin in a clean venv: installs as
# ampremote 1.29.0.post61+g54a3b1ea5, provides both the `mpremote` import
# package and the ampremote/ampr console scripts, and drives a live pod over
# socket://. Includes the SIGTERM/SIGHUP raw-exit guard, so a host tool killed
# mid-session leaves the REPL cleanly instead of stranding it.
dependencies = [
  "ampremote @ git+https://github.com/andrewleech/micropython@54a3b1ea5e8259eef7c7cc9c017ce06ecb0ac499#subdirectory=tools/mpremote",
  "pyelftools",
]

# mcp is capped below 2.0 deliberately. build_server() registers its handlers
# with the decorator API (@server.list_tools(), @server.call_tool()), which
# mcp 2.x removed: installing 2.1.1 makes pod-mcp abort at startup with
# AttributeError: 'Server' object has no attribute 'list_tools'. An unpinned
# install resolves to 2.x, so the cap is what keeps a fresh install working;
# lifting it means porting build_server to the 2.x API.
#
# Install the tool with these extras rather than passing the same packages as
# `uv tool install --with` arguments, which leaves the resolution outside
# version control and lets a reinstall silently pick up an incompatible major:
#   uv tool install --editable ".[zeroconf,mcp]" --force
[project.optional-dependencies]
zeroconf = ["zeroconf"]
mcp = ["mcp<2"]
dev = [
  "pytest",
  "zeroconf",
  "mcp<2",
  "ampremote @ git+https://github.com/andrewleech/micropython@54a3b1ea5e8259eef7c7cc9c017ce06ecb0ac499#subdirectory=tools/mpremote",
]

[project.scripts]
pod = "pod.cli:main"
pod-mcp = "pod.mcp_server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["pod*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
